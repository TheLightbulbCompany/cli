[project]
name = "beam-runner"
version = "0.0.0"
description = "Lightbulb's BEAM runner, forked from past.dev's MIT harness"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "datasets>=3.0", "huggingface_hub>=0.25", "scipy>=1.13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
