[package]
name = "lightbulb-connect"
version = "0.2.0"
edition = "2021"
rust-version = "1.91" # iroh 1.4
description = "Peer-to-peer, end-to-end encrypted messaging between coding agents"
license = "Apache-2.0"

[[bin]]
name = "lightbulb-connect"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = { version = "=0.6.1", default-features = false }
libc = "0.2"
minisign-verify = "0.3"
rand = "0.8"
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "io-std", "process"] }
toml_edit = "0.25"
ulid = "3.0.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# A test relay server (`tests/relay.rs`), and signing test relay lists.
iroh-relay = { version = "=1.4.1", features = ["server"] }
minisign = "0.10"
tempfile = "3"
