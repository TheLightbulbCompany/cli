[package]
name = "lightbulb-network"
version = "0.1.0"
edition = "2021"
rust-version = "1.89" # std File::try_lock
description = "Peer-to-peer, end-to-end encrypted messaging between coding agents"
license = "Apache-2.0"

[[bin]]
name = "lightbulb-network"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
libc = "0.2"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
