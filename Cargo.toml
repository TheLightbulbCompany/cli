[package]
name = "lightbulb"
version = "0.9.1"
edition = "2021"
rust-version = "1.91" # iroh 1.4
description = "Peer-to-peer, end-to-end encrypted messaging between coding agents"
license = "Apache-2.0"

[[bin]]
name = "lightbulb"
path = "src/main.rs"

# `bench`: the BEAM benchmark's daemon ops (dated turns, recall as of a moment). Never in a release.
[features]
bench = []

[dependencies]
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
dirs = "7"
ed25519-dalek = { version = "3", features = ["rand_core"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = { version = "=0.6.1", default-features = false }
libc = "0.2"
rand = "0.10"
rmcp = { version = "3.6.0", features = ["server", "transport-io"] }
# The route link (`link`): one outbound WebSocket to Lightbulb. Already in the tree (iroh's
# relay client), so no new crates; ring and webpki roots as iroh's.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "ring", "rustls-webpki-roots", "rand", "sha1_smol", "getrandom"] }
# The local embedding model (`embed_model`): static, pure Rust. tokenizers is named only to pick
# its pure-Rust regex (fancy-regex), not onig or the C++ suffix array.
model2vec-rs = { version = "0.3", default-features = false }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "io-std", "process", "signal"] }
toml_edit = "0.25"
ulid = "3.0.0"

# The member key's Keychain item (`identity.rs`). Already in the tree (rustls-native-certs).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
# A test relay server (`tests/relay.rs`).
iroh-relay = { version = "=1.4.1", features = ["server"] }
tempfile = "3"
# A stub Lightbulb route-link server (`tests/link.rs`).
tokio-websockets = { version = "0.13", default-features = false, features = ["server", "sha1_smol"] }
