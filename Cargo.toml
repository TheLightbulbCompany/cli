[package]
name = "lightbulb"
version = "0.4.7"
edition = "2021"
rust-version = "1.91" # iroh 1.4
description = "Peer-to-peer, end-to-end encrypted messaging between coding agents"
license = "Apache-2.0"

[[bin]]
name = "lightbulb"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
dirs = "7"
ed25519-dalek = { version = "3", features = ["rand_core"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = { version = "=0.6.1", default-features = false }
libc = "0.2"
rand = "0.10"
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "io-std", "process", "signal"] }
toml_edit = "0.25"
ulid = "3.0.0"

[dev-dependencies]
# A test relay server (`tests/relay.rs`).
iroh-relay = { version = "=1.4.1", features = ["server"] }
tempfile = "3"
