name: Feature request
description: Something lightbulb should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      description: Which agent this is about (Claude Code, Codex, Cursor, Grok CLI), if any.
