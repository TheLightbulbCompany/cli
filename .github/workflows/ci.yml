name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        timeout-minutes: 25
      # The BEAM benchmark's ops (docs/benchmark.md): compiled only with --features bench.
      - run: cargo clippy --all-targets --features bench -- -D warnings
      - run: cargo test --features bench --test bench_ops
      # The real memory model (one download); the other ignored tests are helpers, not run.
      - run: cargo test --test embed_model --test memory_store -- --include-ignored
        env:
          LIGHTBULB_TEST_MODEL: "1"
  # The BEAM runner's tests (bench/beam): offline, fake backend and stubbed model calls.
  beam-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench/beam
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked --with pytest pytest -q
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          v=8.30.1
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_${v}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
      - run: ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --no-banner
