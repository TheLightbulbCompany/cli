name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  macos-arm64:
    runs-on: macos-latest # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # Not signed or notarized yet: that is a later step (Developer ID
      # signing + notarytool), so Gatekeeper will quarantine a browser download.
      - name: Package
        run: |
          tar -czf lightbulb-macos-arm64.tar.gz -C target/release lightbulb
          shasum -a 256 lightbulb-macos-arm64.tar.gz > lightbulb-macos-arm64.tar.gz.sha256
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            lightbulb-macos-arm64.tar.gz lightbulb-macos-arm64.tar.gz.sha256 install.sh

  # Static musl builds, uploaded to the release the macOS job creates (`--clobber` makes a
  # rerun safe). Homebrew and npm stay macOS-only for now.
  # A Linux or WSL `lightbulb update` also needs `<asset>.sha256.sig`, which no job here makes:
  # the release key lives only on the signing Mac, whose `sign-cli-release.yml` (in the
  # Lightbulb monorepo) signs and uploads them (docs/releasing.md). Until then a Linux update
  # refuses the release.
  linux-arm64:
    needs: macos-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y musl-tools
      - run: rustup target add aarch64-unknown-linux-musl
      - run: cargo build --release --target aarch64-unknown-linux-musl
      - name: Package
        run: |
          tar -czf lightbulb-linux-arm64.tar.gz -C target/aarch64-unknown-linux-musl/release lightbulb
          sha256sum lightbulb-linux-arm64.tar.gz > lightbulb-linux-arm64.tar.gz.sha256
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            lightbulb-linux-arm64.tar.gz lightbulb-linux-arm64.tar.gz.sha256

  linux-x86_64:
    needs: macos-arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          tar -czf lightbulb-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-musl/release lightbulb
          sha256sum lightbulb-linux-x86_64.tar.gz > lightbulb-linux-x86_64.tar.gz.sha256
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            lightbulb-linux-x86_64.tar.gz lightbulb-linux-x86_64.tar.gz.sha256

  # npm and Homebrew follow the release. npm publishes through trusted publishing (OIDC: the
  # package on npmjs.com trusts this repository's release.yml), so there is no npm token.
  # The brew job skips (green, with a log line) when its secret is not set.
  publish-npm:
    needs: macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance; no token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5+
      - working-directory: npm
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public

  bump-brew:
    needs: macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN not set; skipping brew bump"
      - if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET=lightbulb-macos-arm64.tar.gz
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ASSET"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p "$ASSET.sha256"
          SHA="$(cut -d' ' -f1 "$ASSET.sha256")"
          echo "$SHA" | grep -Eq '^[0-9a-f]{64}$'
          git clone "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/TheLightbulbCompany/homebrew-tap.git" tap
          cd tap
          F=Formula/lightbulb.rb
          sed -i -E \
            -e "s|^(  url )\".*\"|\1\"$URL\"|" \
            -e "s|^(  sha256 )\"[0-9a-f]*\"|\1\"$SHA\"|" \
            -e "s|\"lightbulb [0-9]+\.[0-9]+\.[0-9]+\"|\"lightbulb $VERSION\"|" \
            "$F"
          git diff
          if git diff --quiet; then echo "Formula already at $VERSION"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "lightbulb $VERSION"
          git push origin HEAD
